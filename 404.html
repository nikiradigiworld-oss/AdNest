<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Anaar</title>
  <script>
    // GitHub Pages SPA routing: encode path as ?p= so index.html can restore it
    var l = window.location;
    var path = l.pathname.slice(1); // strip leading /
    if (path) {
      var qs = (l.search ? l.search.slice(1) + '&' : '') + 'p=' + encodeURIComponent(path);
      l.replace(l.protocol + '//' + l.host + '?' + qs + l.hash);
    }
  </script>
</head>
<body></body>
</html>
